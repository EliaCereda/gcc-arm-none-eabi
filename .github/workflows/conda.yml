name: conda

on:
  push:
    branches: [osx-64-ccache]  # this branch: osx-64 only, iterating on ccache
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # This branch builds ONLY osx-64: the goal is to make it fit the
          # 6 h ceiling via a warm ccache without burning the other runners.
          - { os: macos-15-intel, platform: osx-64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    # 360 is the GitHub-hosted maximum. This build uses a large fraction of it:
    # the toolchain is rebuilt once per multilib. See README if it starts to
    # time out.
    timeout-minutes: 360
    permissions:
      contents: write # to post the build log as a commit comment on failure
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        # The toolchain build needs ~15 GB (per-multilib obj trees + a 2.7 GB
        # install); hosted Linux runners have too little free space with the
        # preinstalled software present. macOS runners have plenty.
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Free runner disk space (macOS)
        # The build ran the runner out of disk 4 h in, during gcc2-nano
        # ("Fatal error: ... 'No space left on device'"). The image ships
        # several Xcode versions; only 16.4 (the default) is used.
        if: runner.os == 'macOS'
        run: |
          df -h /System/Volumes/Data
          sudo rm -rf /Applications/Xcode_1[0-5]*.app /Applications/Xcode_16.[0-3]*.app \
            ~/Library/Developer/CoreSimulator/Caches || true
          df -h /System/Volumes/Data
      - name: Install GNU build helpers (macOS)
        # Arm's set_darwin_envvars adds the Homebrew paths for gnu-getopt and
        # the g-prefixed coreutils (greadlink, gpr) to PATH by itself; the
        # tools just have to be installed. BSD getopt cannot parse the
        # scripts' long options ("getopt: illegal option -- n"), and there is
        # no GNU getopt on conda-forge for macOS.
        if: runner.os == 'macOS'
        run: brew install gnu-getopt coreutils ccache
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-
      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          ccache --max-size=5G || true
          ccache --zero-stats || true
      - name: Install rattler-build
        run: |
          sudo curl -fsSL "https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-${{ matrix.target }}" \
            -o /usr/local/bin/rattler-build
          sudo chmod +x /usr/local/bin/rattler-build
          rattler-build --version
      - name: Build package
        # Below the job's 360 so a too-slow build fails the step instead of
        # cancelling the job — the ccache save below then still runs and the
        # next attempt starts warmer.
        timeout-minutes: 330
        run: |
          set -o pipefail
          rattler-build build --recipe recipe/recipe.yaml --output-dir output 2>&1 | tee build.log
      - name: ccache stats and save
        if: always()
        run: ccache --show-stats || true
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
      - name: Post build log as commit comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI failure on \`${{ matrix.platform }}\` (run ${GITHUB_RUN_ID}), last part of build.log:"
            echo '```'
            tail -c 60000 build.log
            echo '```'
          } | python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' > comment.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --data-binary @comment.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: output/**/*.conda
          if-no-files-found: error

  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing to prefix.dev, no API key needed
    steps:
      # gh run download instead of actions/download-artifact: the latter can
      # only see artifacts uploaded by the *current run attempt*, so it 404s
      # on artifacts from earlier attempts after a partial re-run (e.g. when
      # a runner dies and only the failed leg is re-run). The REST API that
      # gh uses is attempt-agnostic.
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} -R ${{ github.repository }}
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - name: Upload packages to prefix.dev
        run: |
          for pkg in $(find . -name '*.conda'); do
            pixi exec rattler-build upload prefix -c eliacereda "$pkg"
          done
